apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-lb-conf
  namespace: api-bridge
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        upstream ollama_backend {
            server 10.42.1.1:11434 max_fails=3 fail_timeout=30s;
            server 172.83.155.131:11434 max_fails=3 fail_timeout=30s;
        }

        server {
            listen 11434;

            location / {
                proxy_pass http://ollama_backend;
                proxy_set_header Host 127.0.0.1:11434;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                # Streaming-friendly parameters
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-lb
  namespace: api-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-lb
  template:
    metadata:
      labels:
        app: ollama-lb
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ollama-lb-conf
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-lb
  namespace: api-bridge
spec:
  selector:
    app: ollama-lb
  ports:
  - port: 11434
    targetPort: 11434
