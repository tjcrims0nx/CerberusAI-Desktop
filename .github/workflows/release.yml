name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Validate stable release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}".Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Stable releases must use tags like v0.4.0. Got '$tag'. Use the prerelease workflow for beta tags."
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $expected = $tag.TrimStart('v')

          if ($packageVersion -ne $expected -or $tauriVersion -ne $expected -or $cargoVersion -ne $expected) {
            throw "Tag/version mismatch. tag=$tag package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo / Tauri target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (NSIS + MSI)
        run: npx tauri build

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $nsis = Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dst = Join-Path $nsis.Directory "Cerberus-Setup.exe"
            if ($nsis.FullName -ne $dst) { Move-Item -Force $nsis.FullName $dst }
            Write-Host "NSIS: $dst"
          } else {
            Write-Host "::warning::No NSIS exe produced"
          }
          Get-ChildItem "$bundle" -Recurse -Include *.exe,*.msi | ForEach-Object { Write-Host $_.FullName }

      - name: Compute SHA-256 hashes
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files  = Get-ChildItem $bundle -Recurse -Include *.exe,*.msi
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -Append SHA256SUMS.txt
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/Cerberus-Setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cerberus Desktop ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/Cerberus-Setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt

      - name: Update cerberusai.dev release summary
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SERVER_HOST) -or [string]::IsNullOrWhiteSpace($env:SERVER_USERNAME) -or [string]::IsNullOrWhiteSpace($env:SERVER_SSH_KEY)) {
            Write-Host "Server deploy secrets are not configured; skipping cerberusai.dev release summary."
            exit 0
          }

          $release = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json tagName,url,assets | ConvertFrom-Json

          function Format-AssetSize([long] $bytes) {
            if ($bytes -ge 1GB) { return "{0:N1} GB" -f ($bytes / 1GB) }
            if ($bytes -ge 1MB) { return "{0:N1} MB" -f ($bytes / 1MB) }
            if ($bytes -ge 1KB) { return "{0:N1} KB" -f ($bytes / 1KB) }
            return "$bytes B"
          }

          $nsis = $release.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -First 1
          $msi = $release.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1

          $payload = [pscustomobject]@{
            tag = $release.tagName
            url = $release.url
            nsis = if ($nsis) { Format-AssetSize ([long]$nsis.size) } else { "available" }
            msi = if ($msi) { Format-AssetSize ([long]$msi.size) } else { "available" }
          } | ConvertTo-Json -Compress

          $payloadB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload))

          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.ssh" | Out-Null
          $keyPath = "$env:USERPROFILE\.ssh\cerberus_release_key"
          $env:SERVER_SSH_KEY -replace "`r", "" | Set-Content -Path $keyPath -NoNewline
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null

          $remote = @'
          set -euo pipefail
          root=/var/www/cerberus
          stamp=$(date -u +%Y%m%d%H%M%S)
          mkdir -p "/root/cerberus-static-backups/$stamp"
          cp -a "$root/index.html" "/root/cerberus-static-backups/$stamp/index.html"
          python3 - <<'PY'
          import base64
          import html
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(base64.b64decode(os.environ["RELEASE_PAYLOAD_B64"]).decode("utf-8"))
          tag = html.escape(data["tag"])
          url = html.escape(data["url"])
          nsis = html.escape(data["nsis"])
          msi = html.escape(data["msi"])

          path = Path("/var/www/cerberus/index.html")
          page = path.read_text()
          replacement = f'''<div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-bone-400" id="desktop-release-summary">
                    <!-- desktop-release-summary:start -->
                    <a href="{url}" target="_blank" rel="noopener" class="font-mono text-ember-300 underline-offset-4 hover:underline">{tag}</a>
                    <span>NSIS · {nsis}</span>
                    <span>MSI · {msi}</span>
                    <!-- desktop-release-summary:end -->
                  </div>'''

          pattern = re.compile(
              r'<div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-bone-400"(?: id="desktop-release-summary")?>\s*'
              r'(?:<!-- desktop-release-summary:start -->.*?<!-- desktop-release-summary:end -->\s*)?'
              r'<a href="https://github\.com/tjcrims0nx/CerberusAI-Desktop/releases/tag/[^"]+".*?</div>',
              re.S,
          )
          page, count = pattern.subn(replacement, page, count=1)
          if count != 1:
              raise SystemExit(f"Could not update desktop release summary; matches={count}")
          path.write_text(page)
          PY
          chown www-data:www-data "$root/index.html"
          nginx -t
          systemctl reload nginx
          '@

          $remote | ssh -i $keyPath -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new "$env:SERVER_USERNAME@$env:SERVER_HOST" "RELEASE_PAYLOAD_B64='$payloadB64' bash -s"

      - name: Post stable release changelog to Discord
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_CHANGELOG_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_CHANGELOG_WEBHOOK_URL)) {
            Write-Host "DISCORD_CHANGELOG_WEBHOOK_URL is not configured; skipping Discord changelog."
            exit 0
          }

          $release = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json name,tagName,body,url | ConvertFrom-Json
          $description = "**Tag:** ``$($release.tagName)``"
          if (-not [string]::IsNullOrWhiteSpace($release.body)) {
            $description += "`n$($release.body.Trim())"
          }
          $description += "`n`n**Release link:** $($release.url)"
          if ($description.Length -gt 3900) {
            $description = $description.Substring(0, 3800).TrimEnd() + "`n`n...continued on GitHub.`n`n**Release link:** $($release.url)"
          }

          $payload = @{
            username = "CerberusAI Changelog"
            avatar_url = "https://cerberusai.dev/cerberus.png"
            embeds = @(
              @{
                title = "CerberusAI Desktop stable update: $($release.name)"
                url = $release.url
                description = $description
                color = 12616956
                footer = @{ text = "GitHub Releases -> Discord changelog" }
              }
            )
          } | ConvertTo-Json -Depth 8

          Invoke-RestMethod -Method Post -Uri $env:DISCORD_CHANGELOG_WEBHOOK_URL -ContentType "application/json" -Body $payload | Out-Null
