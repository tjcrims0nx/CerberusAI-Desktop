name: Discord Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      title:
        description: "Changelog title"
        required: true
        type: string
      body:
        description: "Markdown changelog body"
        required: true
        type: string
      url:
        description: "Release URL"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify-discord:
    name: Post release changelog to Discord
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}

    steps:
      - name: Build Discord payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              title = os.environ.get("INPUT_TITLE") or "CerberusAI Desktop update"
              tag = os.environ.get("INPUT_TAG") or ""
              body = os.environ.get("INPUT_BODY") or "_No changelog body provided._"
              url = os.environ.get("INPUT_URL") or "https://github.com/tjcrims0nx/CerberusAI-Desktop/releases"
          else:
              title = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "CerberusAI Desktop update"
              tag = os.environ.get("RELEASE_TAG") or ""
              body = os.environ.get("RELEASE_BODY") or "_No release notes provided._"
              url = os.environ.get("RELEASE_URL") or "https://github.com/tjcrims0nx/CerberusAI-Desktop/releases"

          heading = "CerberusAI Desktop stable update"
          tag_line = f"**Tag:** `{tag}`\n" if tag else ""
          description = (
              f"{tag_line}"
              f"{body.strip()}\n\n"
              f"**Release link:** {url}"
          )

          # Discord embed descriptions are limited to 4096 chars.
          if len(description) > 3900:
              description = description[:3800].rstrip() + f"\n\n...continued on GitHub.\n\n**Release link:** {url}"

          payload = {
              "username": "CerberusAI Changelog",
              "avatar_url": "https://cerberusai.dev/cerberus.png",
              "embeds": [
                  {
                      "title": f"{heading}: {title}",
                      "url": url,
                      "description": description,
                      "color": 12616956,
                      "footer": {
                          "text": "GitHub Releases -> Discord changelog"
                      },
                  }
              ],
          }

          Path("discord-payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

      - name: Post to Discord changelog
        env:
          DISCORD_CHANGELOG_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_CHANGELOG_WEBHOOK_URL" ]; then
            echo "DISCORD_CHANGELOG_WEBHOOK_URL secret is missing" >&2
            exit 1
          fi

          curl -fsS \
            -H "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            "$DISCORD_CHANGELOG_WEBHOOK_URL"
